# HTTP → HTTPS redirect for domain
server {
    listen 80;
    listen [::]:80;
    server_name wifi.vault-x.world;
    return 301 https://$host$request_uri;
}

# HTTPS for wifi.vault-x.world
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wifi.vault-x.world;

    ssl_certificate     /etc/letsencrypt/live/wifi.vault-x.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wifi.vault-x.world/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    location / {
        root /var/www/wifi/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        root /var/www/wifi/frontend/dist;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /downloads/ {
        alias /var/www/wifi/downloads/;
        add_header Content-Disposition "attachment";
    }
}
